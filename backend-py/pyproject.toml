[project]
name = "taalmel-sync-backend"
version = "0.1.0"
description = "Taalmel Sync - event-sourced medication reconciliation backend (Phase 1)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "structlog>=24.1",
    "arq>=0.26",
    "redis>=5.0",
    "slowapi>=0.1.9",
    "easyocr>=1.7.2",
    "pymupdf>=2.1",
    "weasyprint>=70.0",
    "qrcode[pil]>=8.2",
    "fpdf2>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Local audio transcription. The API also accepts a browser-produced transcript,
# so this is only needed for server-side audio processing.
speech = ["openai-whisper>=20240930"]
# Local handwritten-line OCR (TrOCR). Google Vision needs no local model.
handwriting = ["transformers>=4.44", "sentencepiece>=0.2", "protobuf>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
